<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leadership Assessment Analytics</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-slate-50 text-slate-900"><main class="max-w-6xl mx-auto p-4 sm:p-8"><header class="mb-8"><div class="text-xs font-bold uppercase tracking-[.2em] text-indigo-600">Leadership Style Compass</div><h1 class="text-3xl sm:text-4xl font-extrabold mt-2">Analytics Dashboard</h1><p class="text-slate-500 mt-2">Live assessment activity and leadership-style distribution.</p></header><div id="status" class="mb-5 rounded-xl bg-white border border-slate-200 p-4 text-sm text-slate-500">Loading analytics…</div><section id="cards" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6"></section><section class="grid lg:grid-cols-2 gap-5"><div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6"><h2 class="font-bold text-lg">Leadership Style Distribution</h2><div id="styles" class="mt-5 space-y-4"></div></div><div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6"><h2 class="font-bold text-lg">Assessment Funnel</h2><div id="funnel" class="mt-5 space-y-3"></div></div></section><section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6 mt-5"><div class="flex justify-between items-center gap-3"><h2 class="font-bold text-lg">Recent Activity</h2><button onclick="load()" class="text-sm font-semibold text-indigo-600">Refresh</button></div><div class="overflow-x-auto mt-4"><table class="w-full text-sm"><thead><tr class="text-left text-slate-400 border-b"><th class="py-3 pr-4">Time</th><th class="py-3 pr-4">Event</th><th class="py-3 pr-4">Style</th><th class="py-3">Source</th></tr></thead><tbody id="activity"></tbody></table></div></section><p class="text-xs text-slate-400 mt-6">Analytics are aggregated from the Leadership Style Compass assessment events.</p></main>
<script>
const sb=window.supabase.createClient('https://ikokwdixcqokscnmsmdx.supabase.co','sb_publishable_MQZrlswXWkIBV0Fz6djudQ_Ix1oxhR6');
const labels={democratic:'Democratic',autocratic:'Autocratic',transformational:'Transformational',transactional:'Transactional',laissez:'Laissez-Faire',servant:'Servant'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=d=>new Date(d).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
async function load(){const status=document.getElementById('status');status.textContent='Loading analytics…';const {data,error}=await sb.from('leadership_assessment_events').select('*').order('created_at',{ascending:false}).limit(1000);if(error){status.textContent='Unable to load analytics: '+error.message;return}const rows=data||[], starts=rows.filter(x=>x.event_type==='start').length, completes=rows.filter(x=>x.event_type==='complete').length, shares=rows.filter(x=>x.event_type==='share').length, answers=rows.filter(x=>x.event_type==='answer').length;const dist={};rows.filter(x=>x.event_type==='complete').forEach(x=>{if(x.style)dist[x.style]=(dist[x.style]||0)+1});document.getElementById('cards').innerHTML=[['Assessments Started',starts],['Completed',completes],['Completion Rate',starts?Math.round(completes/starts*100)+'%':'—'],['Shares',shares]].map(x=>`<div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4"><div class="text-xs font-bold uppercase tracking-wider text-slate-400">${x[0]}</div><div class="text-2xl sm:text-3xl font-extrabold mt-2">${x[1]}</div></div>`).join('');const max=Math.max(1,...Object.values(dist));document.getElementById('styles').innerHTML=Object.keys(labels).map(k=>{const n=dist[k]||0;return `<div><div class="flex justify-between text-sm mb-1"><span class="font-semibold">${labels[k]}</span><span class="text-slate-400">${n}</span></div><div class="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-indigo-500 rounded-full" style="width:${n/max*100}%"></div></div></div>`}).join('');document.getElementById('funnel').innerHTML=[['Started',starts],['Answered',answers],['Completed',completes],['Shared',shares]].map(x=>`<div class="flex items-center justify-between rounded-xl bg-slate-50 px-4 py-3"><span class="font-medium">${x[0]}</span><strong>${x[1]}</strong></div>`).join('');document.getElementById('activity').innerHTML=rows.slice(0,25).map(x=>`<tr class="border-b last:border-0"><td class="py-3 pr-4 whitespace-nowrap text-slate-500">${fmt(x.created_at)}</td><td class="py-3 pr-4 font-medium">${esc(x.event_type)}</td><td class="py-3 pr-4">${esc(labels[x.style]||x.style||'—')}</td><td class="py-3 text-slate-500">${esc(x.source||'direct')}</td></tr>`).join('')||'<tr><td colspan="4" class="py-6 text-slate-400">No activity yet.</td></tr>';status.textContent=`Updated just now · ${rows.length} events loaded`;}
load();
</script></body></html>
