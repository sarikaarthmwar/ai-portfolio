<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A 2-minute leadership style assessment based on six core leadership styles." />
  <title>Leadership Style Compass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #f8fafc; }
    .fade { animation: fade .35s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;
const styles = {
  democratic:{name:"Democratic",icon:"🤝",color:"#3b82f6",tagline:"You lead through participation and shared ownership.",strength:"You create buy-in by listening to different perspectives before moving forward.",blind:"You may spend too much time seeking consensus when a clear decision is needed.",flex:"Know when to move from consultation to decision."},
  autocratic:{name:"Autocratic",icon:"🎯",color:"#475569",tagline:"You lead decisively and provide clear direction.",strength:"You bring clarity and speed when decisions are urgent or ambiguity is high.",blind:"You may unintentionally reduce ownership or discourage dissenting views.",flex:"Pause long enough to hear critical perspectives before deciding."},
  transformational:{name:"Transformational",icon:"🚀",color:"#8b5cf6",tagline:"You lead through vision, inspiration and meaningful change.",strength:"You connect people to a larger purpose and motivate them to think beyond the status quo.",blind:"You may sometimes underweight execution detail or the pace at which people can absorb change.",flex:"Translate vision into clear priorities, milestones and accountability."},
  transactional:{name:"Transactional",icon:"📊",color:"#f59e0b",tagline:"You lead through clarity, goals, performance and accountability.",strength:"You make expectations and outcomes tangible and help teams stay focused on delivery.",blind:"You may over-rely on targets and incentives when people need purpose or support.",flex:"Balance performance management with motivation and development."},
  laissez:{name:"Laissez-Faire",icon:"🕊️",color:"#10b981",tagline:"You lead by trusting capable people with autonomy.",strength:"You empower people to own decisions and avoid unnecessary micromanagement.",blind:"Too much distance can feel like a lack of direction or support.",flex:"Set clear outcomes and checkpoints while preserving autonomy."},
  servant:{name:"Servant",icon:"🌱",color:"#f43f5e",tagline:"You lead by enabling people to succeed and grow.",strength:"You build trust by removing obstacles, developing people and putting their needs into the leadership equation.",blind:"You may delay difficult accountability conversations in an effort to support people.",flex:"Care deeply about people while remaining equally clear about standards."}
};
const questions=[
 {q:"Your project is falling behind schedule. What do you do first?",a:[["Bring the team together and invite ideas on how to recover.","democratic"],["Make a clear recovery decision and tell everyone what needs to happen.","autocratic"],["Reconnect the team with the larger purpose and rally them around the outcome.","transformational"],["Review commitments, targets and accountability with each owner.","transactional"],["Let capable team members decide how they want to recover the schedule.","laissez"],["Understand the obstacles people are facing and remove them.","servant"]]},
 {q:"A major decision has to be made and the team has different opinions. You typically:",a:[["Facilitate discussion and build a shared decision.","democratic"],["Make the call after considering the essentials.","autocratic"],["Frame the decision around the future direction and inspire alignment.","transformational"],["Compare options against agreed objectives and measurable outcomes.","transactional"],["Give the most capable person ownership of the decision.","laissez"],["Ask what people need to feel supported and successful.","servant"]]},
 {q:"A high performer makes a mistake that affects the team. Your first response is to:",a:[["Discuss it openly and understand different perspectives.","democratic"],["Address it directly and set the corrective action.","autocratic"],["Use it as a learning moment connected to growth and improvement.","transformational"],["Review the agreed standard and expected performance.","transactional"],["Let the person take ownership of fixing the issue.","laissez"],["Understand what support or conditions contributed to the mistake.","servant"]]},
 {q:"When starting a new initiative, you naturally focus most on:",a:[["Getting people involved in shaping the approach.","democratic"],["Creating clear direction and decision rights.","autocratic"],["Creating a compelling vision for what could be different.","transformational"],["Defining goals, milestones and measures of success.","transactional"],["Giving capable people freedom to shape the execution.","laissez"],["Creating the conditions for people to learn and succeed.","servant"]]},
 {q:"A team member strongly disagrees with your approach. You:",a:[["Invite them to explain their perspective and encourage others to contribute.","democratic"],["Listen, then make the final call based on what you believe is right.","autocratic"],["Explore whether their challenge can improve the broader vision.","transformational"],["Bring the discussion back to objectives, commitments and outcomes.","transactional"],["Give them space to try an alternative approach if the risk is acceptable.","laissez"],["Try to understand their concern and what they need from you.","servant"]]},
 {q:"Your team is capable and experienced. Your instinct is to:",a:[["Use their collective expertise in important decisions.","democratic"],["Set direction and remain the final decision-maker.","autocratic"],["Challenge them to think bigger and create meaningful change.","transformational"],["Set clear targets and let performance guide the conversation.","transactional"],["Give them substantial autonomy and avoid micromanaging.","laissez"],["Focus on their growth, wellbeing and removing barriers.","servant"]]},
 {q:"When performance is below expectations, you are most likely to:",a:[["Ask the team what is getting in the way and involve them in solutions.","democratic"],["Give direct feedback and specify what must change.","autocratic"],["Reconnect the person with purpose and encourage a stronger contribution.","transformational"],["Review measurable expectations and the consequences of missing them.","transactional"],["Let the person define their own improvement plan and ownership.","laissez"],["Explore root causes and provide coaching or support.","servant"]]},
 {q:"During organizational change, you believe the leader's most important role is to:",a:[["Create a forum where people can influence how the change happens.","democratic"],["Provide decisive direction when uncertainty is high.","autocratic"],["Create belief in the future state and inspire people through the transition.","transformational"],["Translate change into clear deliverables and accountability.","transactional"],["Trust teams to adapt locally without excessive central control.","laissez"],["Listen to concerns and help people navigate the transition.","servant"]]},
 {q:"When a team succeeds, you are most likely to:",a:[["Celebrate the team's collective contribution.","democratic"],["Recognize the people who executed the decision effectively.","autocratic"],["Connect the success to the larger vision and future possibilities.","transformational"],["Recognize achievement against agreed goals and results.","transactional"],["Let the team own the success without needing much leader involvement.","laissez"],["Highlight individual growth and contribution.","servant"]]},
 {q:"When you have limited information and need to act, you tend to:",a:[["Seek enough input to avoid missing an important perspective.","democratic"],["Make the best decision quickly and adjust if necessary.","autocratic"],["Use the desired future state to guide the decision.","transformational"],["Use available data, targets and risk thresholds.","transactional"],["Delegate the decision to whoever is closest to the problem.","laissez"],["Consider how the decision will affect people and what support is needed.","servant"]]},
 {q:"What most motivates you as a leader?",a:[["Creating a sense of shared ownership.","democratic"],["Getting clarity and decisive action.","autocratic"],["Creating meaningful change and inspiring people.","transformational"],["Achieving measurable results.","transactional"],["Seeing capable people operate independently.","laissez"],["Helping people grow and thrive.","servant"]]},
 {q:"If you had to choose one leadership principle, it would be:",a:[["Good decisions become stronger when people are heard.","democratic"],["Leaders must be willing to make the call.","autocratic"],["Leaders should help people believe in what is possible.","transformational"],["Clarity and accountability turn intentions into results.","transactional"],["Trust people enough to give them ownership.","laissez"],["Leadership is about enabling others to succeed.","servant"]]}
];
function App(){
 const [screen,setScreen]=useState("intro"),[i,setI]=useState(0),[answers,setAnswers]=useState([]),[result,setResult]=useState(null);
 function choose(style){const next=[...answers];next[i]=style;setAnswers(next);if(i<questions.length-1)setTimeout(()=>setI(i+1),140);else calculate(next)}
 function calculate(ans){const keys=Object.keys(styles),scores=keys.reduce((o,k)=>(o[k]=0,o),{});ans.forEach(x=>{if(x)scores[x]++});const ranked=keys.map((k,order)=>({key:k,score:scores[k],order})).sort((a,b)=>b.score-a.score||a.order-b.order),groups=[];ranked.forEach(item=>{const last=groups[groups.length-1];if(last&&last.score===item.score)last.keys.push(item.key);else groups.push({score:item.score,keys:[item.key]})});const primaryKeys=groups[0]?.keys||[],secondaryKeys=groups[1]?.keys||[],lowestKeys=groups[groups.length-1]?.keys||[];setResult({scores,primary:primaryKeys[0],secondary:secondaryKeys[0]||null,lowest:lowestKeys[0],primaryKeys,secondaryKeys,lowestKeys,groups});setScreen("result")}
 function namesFor(keys){return(keys||[]).map(k=>styles[k].name).join(" + ")};function scorePercent(score){return Math.round(score/questions.length*100)};function restart(){setScreen("intro");setI(0);setAnswers([]);setResult(null)}
 async function share(){const text=`My leadership style profile is ${namesFor(result.primaryKeys)}. My supporting tendency is ${result.secondaryKeys?.length?namesFor(result.secondaryKeys):"a balanced blend"}. What's yours?`;if(navigator.share){try{await navigator.share({title:"Leadership Style Compass",text,url:location.href})}catch(e){}}else{await navigator.clipboard?.writeText(text+" "+location.href);alert("Result text copied. Paste it into LinkedIn.")}}
 if(screen==="intro")return <main className="min-h-screen flex items-center justify-center p-5 bg-slate-50"><section className="w-full max-w-2xl bg-white rounded-3xl shadow-xl overflow-hidden fade"><div className="p-8 sm:p-12 bg-gradient-to-br from-indigo-600 via-violet-600 to-fuchsia-600 text-white"><div className="text-sm font-semibold tracking-widest uppercase opacity-80">2-minute assessment</div><h1 className="text-4xl sm:text-5xl font-bold mt-3">Leadership Style Compass</h1><p className="text-lg mt-5 text-white/90">Discover your primary leadership style, supporting style and potential blind spot.</p></div><div className="p-8 sm:p-10"><div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-8">{Object.values(styles).map(s=><div key={s.name} className="rounded-2xl bg-slate-50 p-4 text-center"><div className="text-2xl">{s.icon}</div><div className="text-sm font-semibold mt-2">{s.name}</div></div>)}</div><p className="text-slate-600 leading-7">There are no right or wrong answers. Choose the response that most closely reflects how you <strong>naturally lead</strong>, not how you think a leader should behave.</p><button onClick={()=>setScreen("quiz")} className="mt-8 w-full rounded-2xl bg-slate-900 text-white py-4 font-bold text-lg">Start Assessment →</button><p className="text-xs text-slate-400 text-center mt-4">For reflection and development — not a clinical or psychometric diagnosis.</p></div></section></main>;
 if(screen==="quiz"){const q=questions[i],progress=Math.round(i/questions.length*100);return <main className="min-h-screen bg-slate-50 p-4 sm:p-6"><section className="max-w-3xl mx-auto pt-4 sm:pt-10 fade"><div className="flex justify-between items-center mb-3"><span className="text-sm font-semibold text-slate-600">Question {i+1} of {questions.length}</span><span className="text-sm text-slate-400">{progress}%</span></div><div className="h-2 bg-slate-200 rounded-full overflow-hidden"><div className="h-full bg-gradient-to-r from-indigo-500 to-fuchsia-500 transition-all" style={{width:`${Math.max(progress,5)}%`}}/></div><div className="bg-white rounded-3xl shadow-lg mt-7 p-6 sm:p-10"><h2 className="text-2xl sm:text-3xl font-bold text-slate-900 leading-tight">{q.q}</h2><div className="mt-7 space-y-3">{q.a.map(([text,style],idx)=><button key={style} onClick={()=>choose(style)} className="w-full text-left p-4 sm:p-5 rounded-2xl border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 transition"><span className="inline-flex w-8 h-8 rounded-full bg-slate-100 items-center justify-center font-bold text-slate-500 mr-3">{String.fromCharCode(65+idx)}</span><span className="text-slate-700 leading-6">{text}</span></button>)}</div></div></section></main>}
 const p=styles[result.primary];return <main className="min-h-screen bg-slate-50 p-4 sm:p-6"><section className="max-w-3xl mx-auto pt-4 sm:pt-10 fade"><div className="rounded-3xl p-8 sm:p-10 text-white shadow-xl" style={{background:p.color}}><div className="text-sm font-semibold uppercase tracking-widest text-white/75">Your primary style</div><div className="text-6xl mt-4">{p.icon}</div><h1 className="text-4xl sm:text-5xl font-bold mt-3">{p.name} Leader</h1><p className="text-xl text-white/90 mt-3">{p.tagline}</p></div><div className="bg-white rounded-3xl shadow-lg mt-5 p-7 sm:p-9"><div className="grid sm:grid-cols-2 gap-4"><div className="rounded-2xl bg-slate-50 p-5"><div className="text-xs uppercase tracking-wider text-slate-400 font-bold">Supporting style</div><div className="text-xl font-bold mt-2">{result.secondaryKeys?.length?namesFor(result.secondaryKeys):"No distinct second style"}</div></div><div className="rounded-2xl bg-slate-50 p-5"><div className="text-xs uppercase tracking-wider text-slate-400 font-bold">Potential blind spot</div><div className="text-xl font-bold mt-2">{namesFor(result.lowestKeys)}</div></div></div><div className="mt-7 space-y-5"><div><h3 className="font-bold text-slate-900">Your strength</h3><p className="text-slate-600 mt-1 leading-7">{p.strength}</p></div><div><h3 className="font-bold text-slate-900">Watch out for</h3><p className="text-slate-600 mt-1 leading-7">{p.blind}</p></div><div><h3 className="font-bold text-slate-900">Leadership flex</h3><p className="text-slate-600 mt-1 leading-7">{p.flex}</p></div></div><div className="mt-8 p-5 rounded-2xl bg-indigo-50 text-indigo-950"><strong>The bigger insight:</strong> Great leadership isn't about having one perfect style. It's about knowing your default style — and knowing when to flex.</div><div className="mt-8 p-5 rounded-2xl border border-slate-200 bg-slate-50"><h3 className="font-bold text-slate-900 text-lg">How scoring works</h3><p className="text-sm text-slate-600 mt-2 leading-6">Each selected answer contributes <strong>1 point</strong> to the leadership style it represents. With 12 questions, all six style scores add up to <strong>12</strong>.</p><div className="grid sm:grid-cols-3 gap-3 mt-4 text-sm"><div className="bg-white rounded-xl border border-slate-200 p-3"><strong>Primary</strong><div className="text-slate-500">Highest score</div></div><div className="bg-white rounded-xl border border-slate-200 p-3"><strong>Supporting</strong><div className="text-slate-500">Second-highest score</div></div><div className="bg-white rounded-xl border border-slate-200 p-3"><strong>Watch-out</strong><div className="text-slate-500">Lowest score</div></div></div></div><div className="mt-7"><div className="flex justify-between items-center mb-3"><h3 className="font-bold text-slate-900 text-lg">Your score breakdown</h3><span className="text-xs text-slate-400">Score / 12</span></div><div className="space-y-3">{Object.entries(result.scores).sort((a,b)=>b[1]-a[1]).map(([key,score])=><div key={key}><div className="flex justify-between text-sm mb-1"><span className="font-semibold text-slate-700">{styles[key].icon} {styles[key].name}</span><span className="font-bold text-slate-600">{score} / 12 · {scorePercent(score)}%</span></div><div className="h-3 bg-slate-200 rounded-full overflow-hidden"><div className="h-full rounded-full" style={{width:`${scorePercent(score)}%`,background:styles[key].color}}></div></div></div>)}</div></div>{(result.primaryKeys?.length>1||result.secondaryKeys?.length>1||result.lowestKeys?.length>1)&&<div className="mt-5 p-4 rounded-2xl border border-amber-200 bg-amber-50 text-sm text-amber-900"><strong>Tie detected:</strong> Your profile contains tied styles, so the assessment shows the blend rather than forcing a single answer.</div>}<div className="mt-7 flex flex-col sm:flex-row gap-3"><button onClick={share} className="flex-1 rounded-2xl bg-slate-900 text-white py-4 font-bold">Share My Result ↗</button><button onClick={restart} className="flex-1 rounded-2xl border border-slate-300 py-4 font-bold text-slate-700">Retake Assessment</button></div></div><p className="text-center text-xs text-slate-400 my-6">Leadership Style Compass • Self-reflection tool, not a validated psychometric assessment</p></section></main>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
