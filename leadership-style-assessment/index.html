<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A 2-minute leadership style assessment based on six core leadership styles."><title>Leadership Style Compass</title><script src="https://cdn.tailwindcss.com"></script><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{margin:0;background:#f8fafc}.fade{animation:fade .25s ease-out}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}</style></head><body><div id="root"></div><script type="text/babel">
const{useState}=React;const styles={democratic:{name:'Democratic',icon:'🤝',color:'#3b82f6',tag:'You lead through participation and shared ownership.',strength:'You create buy-in by listening to different perspectives.',blind:'You may spend too much time seeking consensus.',flex:'Know when to move from consultation to decision.'},autocratic:{name:'Autocratic',icon:'🎯',color:'#475569',tag:'You lead decisively and provide clear direction.',strength:'You bring clarity and speed when decisions are urgent.',blind:'You may reduce ownership or discourage dissent.',flex:'Pause long enough to hear critical perspectives.'},transformational:{name:'Transformational',icon:'🚀',color:'#8b5cf6',tag:'You lead through vision, inspiration and change.',strength:'You connect people to purpose and motivate change.',blind:'You may underweight execution detail.',flex:'Translate vision into priorities and accountability.'},transactional:{name:'Transactional',icon:'📊',color:'#f59e0b',tag:'You lead through goals, performance and accountability.',strength:'You make expectations and outcomes tangible.',blind:'You may over-rely on targets when people need support.',flex:'Balance performance with motivation and development.'},laissez:{name:'Laissez-Faire',icon:'🕊️',color:'#10b981',tag:'You lead by trusting capable people with autonomy.',strength:'You empower people and avoid unnecessary micromanagement.',blind:'Too much distance can feel like lack of direction.',flex:'Set clear outcomes and checkpoints while preserving autonomy.'},servant:{name:'Servant',icon:'🌱',color:'#f43f5e',tag:'You lead by enabling people to succeed and grow.',strength:'You build trust by removing obstacles and developing people.',blind:'You may delay difficult accountability conversations.',flex:'Care about people while staying clear about standards.'}};const qs=[['Your project is falling behind schedule. What do you do first?',['Bring the team together and invite recovery ideas.','Make a clear recovery decision and direct the team.','Reconnect everyone with the larger purpose and outcome.','Review commitments, targets and accountability.','Let capable team members decide how to recover.','Understand obstacles and remove them.']],['A major decision has different opinions. You typically:',['Facilitate discussion and build a shared decision.','Make the call after considering the essentials.','Frame it around future direction and inspire alignment.','Compare options against objectives and outcomes.','Give the most capable person ownership.','Ask what people need to feel supported.']],['A high performer makes a mistake affecting the team. You first:',['Discuss it openly and hear perspectives.','Address it directly and set corrective action.','Use it as a learning and growth moment.','Review the standard and expected performance.','Let the person own fixing the issue.','Understand what support or conditions contributed.']],['When starting a new initiative, you focus most on:',['Getting people involved in shaping the approach.','Creating clear direction and decision rights.','Creating a compelling vision for what could change.','Defining goals, milestones and measures.','Giving capable people freedom to execute.','Creating conditions for people to learn and succeed.']],['A team member strongly disagrees with you. You:',['Invite their perspective and others to contribute.','Listen, then make the final call.','Explore whether the challenge improves the vision.','Return the discussion to objectives and outcomes.','Allow an alternative approach if risk is acceptable.','Understand their concern and what they need.']],['Your team is capable and experienced. Your instinct is to:',['Use their collective expertise in decisions.','Set direction and remain final decision-maker.','Challenge them to think bigger.','Set clear targets and let performance guide.','Give substantial autonomy.','Focus on growth, wellbeing and removing barriers.']],['When performance is below expectations, you:',['Involve the team in understanding what is getting in the way.','Give direct feedback and specify what must change.','Reconnect the person with purpose.','Review measurable expectations and consequences.','Let the person define their improvement plan.','Explore root causes and provide coaching.']],['During organizational change, the leader should:',['Create a forum where people can influence the change.','Provide decisive direction during uncertainty.','Create belief in the future state.','Translate change into deliverables and accountability.','Trust teams to adapt locally.','Listen to concerns and help people navigate.']],['When a team succeeds, you most likely:',['Celebrate the collective contribution.','Recognize effective execution.','Connect success to the larger vision.','Recognize achievement against goals.','Let the team own the success.','Highlight individual growth and contribution.']],['With limited information, you tend to:',['Seek enough input to avoid missing perspectives.','Make the best decision quickly and adjust.','Use the desired future state to guide you.','Use available data, targets and risk thresholds.','Delegate to whoever is closest to the problem.','Consider impact on people and support needed.']],['What most motivates you as a leader?',['Creating shared ownership.','Getting clarity and decisive action.','Creating meaningful change and inspiration.','Achieving measurable results.','Seeing capable people operate independently.','Helping people grow and thrive.']],['If you had to choose one leadership principle:',['Good decisions become stronger when people are heard.','Leaders must be willing to make the call.','Leaders should help people believe in what is possible.','Clarity and accountability turn intentions into results.','Trust people enough to give them ownership.','Leadership is about enabling others to succeed.']]];const keys=Object.keys(styles);
function App(){const[screen,setScreen]=useState('intro'),[i,setI]=useState(0),[ans,setAns]=useState([]),[result,setResult]=useState(null);const choose=k=>{const a=[...ans];a[i]=k;setAns(a)};const finish=()=>{const scores=keys.reduce((o,k)=>(o[k]=0,o),{});ans.forEach(k=>k&&(scores[k]++));const ranked=keys.map((k,n)=>({k,s:scores[k],n})).sort((a,b)=>b.s-a.s||a.n-b.n),groups=[];ranked.forEach(x=>{const g=groups.at(-1);if(g&&g.s===x.s)g.k.push(x.k);else groups.push({s:x.s,k:[x.k]})});setResult({scores,groups});setScreen('result')};const next=()=>ans[i]&&(i<qs.length-1?setI(i+1):finish());const names=k=>(k||[]).map(x=>styles[x].name).join(' + '),pct=s=>Math.round(s/qs.length*100),restart=()=>{setScreen('intro');setI(0);setAns([]);setResult(null)};
if(screen==='intro')return <main className="min-h-screen flex items-center justify-center p-3 sm:p-6"><section className="w-full max-w-2xl bg-white rounded-2xl sm:rounded-3xl shadow-xl overflow-hidden"><div className="p-6 sm:p-12 bg-gradient-to-br from-indigo-600 via-violet-600 to-fuchsia-600 text-white"><div className="text-xs sm:text-sm font-semibold uppercase tracking-widest opacity-80">2-minute assessment</div><h1 className="text-3xl sm:text-5xl font-bold mt-2">Leadership Style Compass</h1><p className="text-base sm:text-lg mt-4 text-white/90">Discover your primary leadership style, supporting style and potential blind spot.</p></div><div className="p-5 sm:p-10"><div className="grid grid-cols-2 sm:grid-cols-3 gap-2 sm:gap-3 mb-6 sm:mb-8">{keys.map(k=><div key={k} className="rounded-xl sm:rounded-2xl bg-slate-50 p-3 sm:p-4 text-center"><div className="text-xl sm:text-2xl">{styles[k].icon}</div><div className="text-xs sm:text-sm font-semibold mt-1 sm:mt-2">{styles[k].name}</div></div>)}</div><p className="text-sm sm:text-base text-slate-600 leading-6 sm:leading-7">There are no right or wrong answers. Choose what most closely reflects how you <strong>naturally lead</strong>.</p><button onClick={()=>setScreen('quiz')} className="mt-6 w-full rounded-xl sm:rounded-2xl bg-slate-900 text-white py-3.5 sm:py-4 font-bold text-base sm:text-lg">Start Assessment →</button><p className="text-[11px] sm:text-xs text-slate-400 text-center mt-3">For reflection and development — not a validated psychometric diagnosis.</p></div></section></main>;
if(screen==='quiz'){const[q,opts]=qs[i],selected=ans[i]||null,progress=Math.round((i+1)/qs.length*100);return <main className="min-h-screen bg-slate-50 px-3 py-3 sm:p-6"><section className="max-w-3xl mx-auto pt-1 sm:pt-8 fade"><div className="flex justify-between items-center mb-2"><span className="text-xs sm:text-sm font-semibold text-slate-600">Question {i+1} of {qs.length}</span><span className="text-xs sm:text-sm text-slate-400">{progress}%</span></div><div className="h-1.5 sm:h-2 bg-slate-200 rounded-full overflow-hidden"><div className="h-full bg-gradient-to-r from-indigo-500 to-fuchsia-500" style={{width:progress+'%'}}/></div><div className="bg-white rounded-2xl sm:rounded-3xl shadow-lg mt-4 sm:mt-6 p-4 sm:p-8"><h2 className="text-xl sm:text-3xl font-bold text-slate-900 leading-snug">{q}</h2><div className="mt-4 sm:mt-6 space-y-2">{opts.map((text,n)=>{const k=keys[n];return <button key={k} onClick={()=>choose(k)} className={'w-full text-left p-3 sm:p-4 rounded-xl sm:rounded-2xl border transition flex items-start gap-2.5 '+(selected===k?'border-indigo-500 bg-indigo-50 ring-2 ring-indigo-200':'border-slate-200 hover:border-indigo-400 hover:bg-indigo-50')}><span className={'shrink-0 inline-flex w-7 h-7 sm:w-8 sm:h-8 rounded-full items-center justify-center font-bold text-sm '+(selected===k?'bg-indigo-600 text-white':'bg-slate-100 text-slate-500')}>{String.fromCharCode(65+n)}</span><span className="text-sm sm:text-base text-slate-700 leading-5 sm:leading-6">{text}</span></button>})}</div><button onClick={next} disabled={!selected} className={'mt-4 sm:mt-6 w-full rounded-xl sm:rounded-2xl py-3.5 sm:py-4 font-bold text-base sm:text-lg '+(selected?'bg-slate-900 text-white hover:bg-slate-800':'bg-slate-200 text-slate-400 cursor-not-allowed')}>{i===qs.length-1?'See My Leadership Style →':'Next →'}</button></div></section></main>}
const top=result.groups[0],second=result.groups[1],low=result.groups.at(-1),p=styles[top.k[0]];return <main className="min-h-screen bg-slate-50 p-3 sm:p-6"><section className="max-w-3xl mx-auto pt-2 sm:pt-8 fade"><div className="rounded-2xl sm:rounded-3xl p-6 sm:p-10 text-white shadow-xl" style={{background:p.color}}><div className="text-xs sm:text-sm font-semibold uppercase tracking-widest text-white/75">Your primary style</div><div className="text-5xl sm:text-6xl mt-3">{p.icon}</div><h1 className="text-3xl sm:text-5xl font-bold mt-2">{p.name} Leader</h1><p className="text-base sm:text-xl text-white/90 mt-2">{p.tag}</p></div><div className="bg-white rounded-2xl sm:rounded-3xl shadow-lg mt-4 p-5 sm:p-8"><div className="grid grid-cols-2 gap-3"><div className="rounded-xl bg-slate-50 p-4"><div className="text-[10px] sm:text-xs uppercase tracking-wider text-slate-400 font-bold">Supporting</div><div className="text-base sm:text-xl font-bold mt-1">{second?names(second.k):'Balanced blend'}</div></div><div className="rounded-xl bg-slate-50 p-4"><div className="text-[10px] sm:text-xs uppercase tracking-wider text-slate-400 font-bold">Watch-out</div><div className="text-base sm:text-xl font-bold mt-1">{names(low.k)}</div></div></div><div className="mt-5 space-y-4"><div><h3 className="font-bold">Your strength</h3><p className="text-sm sm:text-base text-slate-600 mt-1 leading-6">{p.strength}</p></div><div><h3 className="font-bold">Watch out for</h3><p className="text-sm sm:text-base text-slate-600 mt-1 leading-6">{p.blind}</p></div><div><h3 className="font-bold">Flex your style</h3><p className="text-sm sm:text-base text-slate-600 mt-1 leading-6">{p.flex}</p></div></div><div className="mt-6"><h3 className="font-bold mb-3">Your score breakdown</h3>{keys.map(k=><div key={k} className="mb-2"><div className="flex justify-between text-xs sm:text-sm mb-1"><span>{styles[k].name}</span><span className="font-semibold">{result.scores[k]}/{qs.length}</span></div><div className="h-2 bg-slate-100 rounded-full overflow-hidden"><div className="h-full" style={{width:pct(result.scores[k])+'%',background:styles[k].color}}/></div></div>)}</div><div className="flex gap-2 mt-6"><button onClick={restart} className="flex-1 rounded-xl border border-slate-200 py-3 font-bold">Retake</button><button onClick={()=>navigator.share?navigator.share({title:'Leadership Style Compass',text:`My leadership style is ${names(top.k)}. What's yours?`,url:location.href}):navigator.clipboard?.writeText(location.href)} className="flex-1 rounded-xl bg-slate-900 text-white py-3 font-bold">Share</button></div><p className="text-[11px] text-slate-400 mt-5">This is a self-reflection tool, not a validated psychometric assessment.</p></div></section></main>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
